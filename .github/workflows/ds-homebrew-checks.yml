name: Validate DS homebrew integration
on:
  pull_request:
    paths:
      - games/emulators/index.html
      - app.js
      - index.html
      - games/ds-homebrew/**
      - tests/ds-homebrew.test.cjs
      - .github/workflows/install-ds-homebrew.yml
      - .github/workflows/ds-homebrew-checks.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/ds-homebrew.test.cjs
