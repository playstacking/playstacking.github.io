name: Build Lazy Chess browser game
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-lazy-chess.yml
permissions:
  contents: write
concurrency:
  group: playstack-lazy-chess
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cinqmarsmedia/Lazy-Chess-An-Indie-Chess-Puzzle-Game
          ref: main
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '14'
      - name: Install and build Ionic web output
        working-directory: upstream
        run: |
          set -euo pipefail
          npm ci --legacy-peer-deps
          ./node_modules/.bin/ionic-app-scripts build --prod
          test -s www/index.html
      - name: Install static web build
        run: |
          mkdir -p games/lazy-chess-build
          cp -a upstream/www/. games/lazy-chess-build/
          test -s games/lazy-chess-build/index.html
          if find games/lazy-chess-build -type f -size +95M | grep .; then exit 1; fi
          rm -rf upstream
      - name: Commit generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/lazy-chess-build
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy Lazy Chess web build'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
