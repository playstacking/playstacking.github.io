<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperTuxKart - Playstack</title><style>body{margin:0;display:grid;place-items:center;min-height:100dvh;background:#111722;color:#fff;font:16px system-ui}main{max-width:550px;padding:28px}h1{font-size:2.5rem}p{line-height:1.6;color:#cad1dc}button{background:#66d999;border:0;border-radius:9px;padding:15px 24px;font-weight:700;cursor:pointer}a{color:#9bdaff}#status{font-size:14px}</style><main><h1>SuperTuxKart</h1><p>Experimental WebAssembly racing port</p><p>The browser port needs approximately 120 MB of assets and 500 MB of memory. iPad compatibility is unverified.</p><button id="start">Check for hosted game</button><p id="status" role="status">The local game build has not been verified yet.</p><p><a href="https://github.com/ading2210/stk-code/tree/wasm" target="_blank" rel="noopener">Open-source project details</a></p></main><script>document.getElementById('start').onclick=async()=>{const status=document.getElementById('status');status.textContent='Checking locally hosted game files…';try{const res=await fetch('../supertuxkart-build/index.html',{cache:'no-store'});if(!res.ok)throw Error('Game build not deployed');const html=await res.text();if(!html.toLowerCase().includes('<html'))throw Error('Invalid game entry page');location.replace('../supertuxkart-build/index.html')}catch(e){status.textContent='Not installed yet. The source build needs to be deployed before this game can run.'}}</script></html>
