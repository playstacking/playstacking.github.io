<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>shapez - Playstack</title><style>body{margin:0;display:grid;place-items:center;min-height:100dvh;background:#111722;color:#fff;font:16px system-ui}main{max-width:550px;padding:28px}h1{font-size:2.5rem}p{line-height:1.6;color:#cad1dc}button{background:#66d999;border:0;border-radius:9px;padding:15px 24px;font-weight:700;cursor:pointer}a{color:#9bdaff}#status{font-size:14px}</style><main><h1>shapez</h1><p>Open-source factory builder</p><p>This is the original shapez browser game. Mouse or trackpad controls work best.</p><button id="start">Play shapez</button><p id="status" role="status">The browser build is installed. Choose Play to open the game.</p><p><a href="https://github.com/tobspr-games/shapez.io" target="_blank" rel="noopener">Open-source project details</a></p></main><script>document.getElementById('start').onclick=async()=>{const status=document.getElementById('status');status.textContent='Checking locally hosted game files…';try{const res=await fetch('../shapez-build/index.html',{cache:'no-store'});if(!res.ok)throw Error('Game build not deployed');const html=await res.text();if(!html.toLowerCase().includes('<html'))throw Error('Invalid game entry page');location.replace('../shapez-build/index.html')}catch(e){status.textContent='Not installed yet. The source build needs to be deployed before this game can run.'}}</script></html>
