<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N64 Game Loader - Playstack</title><style>body{margin:0;background:#111722;color:#fff;font:16px system-ui}main{max-width:720px;margin:30px auto;padding:20px}p{color:#cbd5e1;line-height:1.5}label{display:block;margin:18px 0}input{max-width:100%}button{padding:12px 20px;border:0;border-radius:8px;background:#76d69e;font-weight:700;cursor:pointer}#game{width:100%;min-height:70vh}a{color:#9bd7ff}</style></head><body><main id="intro"><h1>Nintendo 64 • Playstack</h1><p>Load a Nintendo 64 game file that you own and have permission to use. Game files are not provided or hosted by Playstack.</p><label>Select your own N64 ROM (.z64, .n64, .v64) <input id="rom" type="file" accept=".z64,.n64,.v64"></label><button id="launch" disabled>Load game here</button><p id="status" role="status">Uses the local EmulatorJS runtime when installed. You must supply your own N64 game file.</p><p><a href="https://github.com/EmulatorJS/EmulatorJS" target="_blank" rel="noopener">EmulatorJS source</a></p></main><div id="game" hidden></div><script>let selected=null;const input=document.getElementById('rom'),button=document.getElementById('launch'),status=document.getElementById('status');input.addEventListener('change',()=>{selected=input.files[0];button.disabled=!selected;status.textContent=selected?'Ready to load your local game file.':'Select a game file first.'});button.addEventListener('click',async()=>{if(!selected)return;try{const probe=await fetch('../emulatorjs/data/loader.js',{method:'HEAD',cache:'no-store'});if(!probe.ok)throw Error('unavailable')}catch(e){status.textContent='Local emulator build is not deployed yet. Check the GitHub Actions install workflow.';return;}if(!/\.(z64|n64|v64)$/i.test(selected.name)){status.textContent='Please select an N64 game file.';return}const url=URL.createObjectURL(selected);document.getElementById('intro').hidden=true;document.getElementById('game').hidden=false;window.EJS_player='#game';window.EJS_core='n64';window.EJS_gameName=selected.name;window.EJS_gameUrl=url;window.EJS_pathtodata='../emulatorjs/data/';const script=document.createElement('script');script.src='../emulatorjs/data/loader.js';script.onerror=()=>{document.getElementById('intro').hidden=false;document.getElementById('game').hidden=true;status.textContent='Could not load emulator runtime. Check whether the CDN is reachable.'};document.body.appendChild(script)});</script></body></html>
